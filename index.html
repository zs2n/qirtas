    footNav: "الموقع", footContact: "تواصل", noNews: "لا أخبار بعد.",
    copy: "© قرطاس", top: "إلى الأعلى",
    langBtn: "EN", langAria: "Switch to English", themeAria: { dark: "التبديل إلى النمط الفاتح", light: "التبديل إلى النمط الداكن" }
  },
  en: {
    title: "Qirtas — Game studio", skip: "Skip to content", home: "Qirtas",
    nav: { about: "About", news: "News", games: "Games", contact: "Contact" },
    h: { about: "About", news: "News", games: "Games", contact: "Contact us" },
    heroGames: "Games", heroContact: "Contact us",
    soon: "Coming soon", steamSoon: "Coming soon to", play: "Play now", playAria: "Play ", mobile: "Playable on mobile", mobileShort: "Playable on mobile",
    contactH: "Contact us", contactP: "For collaborations, questions or suggestions.",
    joinH: "Join our team", joinP: "Want to work with us? Tell us about yourself and your work.",
    joinSubject: "Request to join the Qirtas team", mail: "Email us", copyBtn: "Copy", copied: "Copied", mailLabel: "Email", join: "Send a join request", ig: "Instagram",
    footNav: "Site", footContact: "Contact", noNews: "No news yet.",
    copy: "© Qirtas", top: "Back to top",
    langBtn: "ع", langAria: "التبديل إلى العربية", themeAria: { dark: "Switch to light mode", light: "Switch to dark mode" }
  }
};

(function () {
  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var lang = root.lang === "en" ? "en" : "ar";
  var NS = "http://www.w3.org/2000/svg";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function nameNode(n) { var b = document.createElement("bdi"); b.textContent = n[lang]; return b; }
  function ext(a, href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }
  function pick(v) { return typeof v === "string" ? v : v[lang]; }
  var ICONS = {
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    ig: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/>',
    steam: '<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><g fill="none" stroke="#171a21" stroke-width="1.6"><circle cx="15.6" cy="9.3" r="3.1"/><path d="M9.4 14.6l3.3-2.6" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="8.3" cy="15.7" r="2.3" fill="#171a21"/><circle cx="8.3" cy="15.7" r="0.9" fill="currentColor"/>',
    phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.2"/><rect class="scr" x="8.8" y="5" width="6.4" height="12.6" rx="0.8"/><path d="M10.5 19.6h3"/>'
  };
  /* أيقونات ثابتة من الكود نفسه (ليست نصًا خارجيًا) */
  function icon(name, cls) {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    if (cls) s.setAttribute("class", cls);
    s.innerHTML = ICONS[name]; return s;
  }
  function btn(kind, label, href, ic, isExt) {
    var a = el("a", "btn " + kind);
    a.href = href; if (isExt) ext(a, href);
    if (ic) a.appendChild(icon(ic, ic === "arrow" ? "arrow" : null));
    a.appendChild(el("span", null, label)); return a;
  }
  function setMeta(sel, attr, val) { var m = document.querySelector(sel); if (m) m.setAttribute(attr, val); }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (!m) return s;
    try {
      return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString(lang === "ar" ? "ar-u-nu-latn" : "en", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
    } catch (e) { return s; }
  }
  /* يفتح كتابة رسالة في Gmail مباشرة بدل تطبيق البريد الافتراضي */
  function mailUrl(subject) {
    return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(SITE.email) + (subject ? "&su=" + encodeURIComponent(subject) : "");
  }
  function copyText(txt, done) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { done(true); }, fallback);
    else fallback();
  }
  function igUrl() { return "https://www.instagram.com/" + encodeURIComponent(String(SITE.instagram).replace(/^@/, "")) + "/"; }

  function render() {
    var t = UI[lang];
    root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t.title;
    setMeta('meta[name="description"]', "content", SITE.about[lang]);
    setMeta('meta[property="og:title"]', "content", t.title);
    setMeta('meta[property="og:description"]', "content", SITE.about[lang]);
    setMeta('meta[property="og:locale"]', "content", lang === "ar" ? "ar_AR" : "en_US");
    setMeta('meta[property="og:locale:alternate"]', "content", lang === "ar" ? "en_US" : "ar_AR");
    setMeta('meta[property="og:image:alt"]', "content", t.home);
    setMeta('meta[property="og:url"]', "content", SITE.studioUrl);

    $("skip").textContent = t.skip;
    Array.prototype.forEach.call(document.querySelectorAll(".brand img, .hero-logo img"), function (i) { i.alt = t.home; });
    var nav = $("nav"); nav.textContent = "";
    nav.setAttribute("aria-label", lang === "ar" ? "التنقل الرئيسي" : "Main navigation");
    ["about", "news", "games", "contact"].forEach(function (k) {
      var a = el("a", null, t.nav[k]); a.href = "#" + k; nav.appendChild(a);
    });

    var ha = $("heroActions"); ha.textContent = "";
    ha.appendChild(btn("solid", t.heroGames, "#games", "arrow"));
    ha.appendChild(btn("line", t.heroContact, "#contact"));

    $("h-about").textContent = t.h.about; $("aboutText").textContent = SITE.about[lang];
    $("h-news").textContent = t.h.news; $("h-games").textContent = t.h.games; $("h-contact").textContent = t.h.contact;

    /* الأخبار */
    var nb = $("newsBody"); nb.textContent = "";
    var pl = el("ul", "posts");
    SITE.posts.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }).forEach(function (p) {
      var li = el("li", "card");
      if (p.image) {
        var c = el("div", "cover"); var pi = el("img"); pi.src = pick(p.image); pi.alt = (p.alt || p.title)[lang];
        pi.width = 1200; pi.height = 675; pi.loading = "lazy"; c.appendChild(pi); li.appendChild(c);
      }
      if (p.soon && li.firstChild) li.firstChild.appendChild(el("span", "chip red", t.soon));
      var b = el("div", "cbody"); var ph = el("h3"); ph.appendChild(document.createTextNode(p.title[lang]));
      b.appendChild(ph);
      var tm = el("time", null, fmtDate(p.date)); tm.dateTime = p.date; b.appendChild(tm);
      b.appendChild(el("p", null, p.text[lang]));
      if (p.link) b.appendChild(btn("solid play", t.play, p.link, "arrow", true));
      li.appendChild(b); pl.appendChild(li);
    });
    if (SITE.posts.length) nb.appendChild(pl); else nb.appendChild(el("p", null, t.noNews));

    /* الألعاب */
    var ul = $("gamesList"); ul.textContent = "";
    SITE.games.forEach(function (g) {
      var live = g.status === "live" && g.url;
      var li = el("li", "card" + (live ? "" : " soon"));
      if (g.image) {
        var cov = el("div", "cover"); var im = el("img"); im.src = pick(g.image); im.alt = g.name[lang];
        im.width = 1200; im.height = 675; im.loading = "lazy"; cov.appendChild(im);
        if (!live) cov.appendChild(el("span", "chip red", t.soon));
        li.appendChild(cov);
      }
      var inner = el("div", "cbody");
      var h = el("h3"); h.appendChild(nameNode(g.name)); inner.appendChild(h);
      if (g.line) inner.appendChild(el("p", null, g.line[lang]));
      if (live && g.credit) {
        var cr = el("p", "credit"); cr.appendChild(document.createTextNode(g.credit[lang] + " "));
        cr.appendChild(ext(el("a", null, g.credit.name[lang]), g.credit.url)); inner.appendChild(cr);
      }
      var foot = el("div", "cfoot");
      if (live) {
        var a = btn("solid", t.play, g.url, "arrow", true);
        a.setAttribute("aria-label", t.playAria + g.name[lang]); foot.appendChild(a);
        var mn = el("span", "mnote phone-glow"); mn.appendChild(icon("phone")); mn.appendChild(el("span", null, t.mobileShort)); foot.appendChild(mn);
      } else if (g.steam) {
        var st = el("span", "steam"); st.appendChild(el("span", null, t.steamSoon)); st.appendChild(icon("steam")); st.appendChild(el("b", null, "STEAM"));
        foot.appendChild(st);
      }
      if (foot.firstChild) inner.appendChild(foot);
      li.appendChild(inner); ul.appendChild(li);
    });

    /* التواصل */
    var cb = $("contactBody"); cb.textContent = "";
    cb.appendChild(el("p", "cnote", t.contactP));
    var cl = el("ul", "clist");
    function crow(ic, label, value, href, isExt) {
      var li = el("li"); var a = el("a", "crow"); a.href = href; if (isExt) ext(a, href);
      var i = el("span", "cic"); i.appendChild(icon(ic)); a.appendChild(i);
      var tx = el("span", "ctx"); tx.appendChild(el("small", null, label)); tx.appendChild(el("bdi", null, value)); a.appendChild(tx);
      a.appendChild(icon("arrow", "arrow carr")); li.appendChild(a); cl.appendChild(li);
    }
    if (SITE.email) {
      crow("mail", t.mailLabel, SITE.email, mailUrl(), true);
      var cp = el("button", "copybtn", t.copyBtn); cp.type = "button";
      cp.addEventListener("click", function () {
        copyText(SITE.email, function (ok) {
          cp.textContent = ok ? t.copied : t.copyBtn; cp.classList.toggle("done", ok);
          setTimeout(function () { cp.textContent = t.copyBtn; cp.classList.remove("done"); }, 2000);
        });
      });
      cl.lastChild.classList.add("hascopy"); cl.lastChild.appendChild(cp);
    }
    if (SITE.instagram) crow("ig", t.ig, "@" + String(SITE.instagram).replace(/^@/, ""), igUrl(), true);
    cb.appendChild(cl);

    /* الفوتر */
    $("footAbout").textContent = SITE.about[lang];
    $("footNavH").textContent = t.footNav; $("footContactH").textContent = t.footContact;
    var fn = $("footNav"); fn.textContent = "";
    ["about", "news", "games", "contact"].forEach(function (k) {
      var li = el("li"); var a = el("a", null, t.nav[k]); a.href = "#" + k; li.appendChild(a); fn.appendChild(li);
    });
    var fc = $("footContact"); fc.textContent = "";
    function fli(label, href, isExt) { var li = el("li"); var a = el("a", null, label); a.href = href; if (isExt) ext(a, href); li.appendChild(a); fc.appendChild(li); }
    if (SITE.email) fli(t.mail, mailUrl(), true);
    if (SITE.instagram) fli(t.ig, igUrl(), true);
    if (SITE.email) { var jl = el("li", "joinli"); jl.appendChild(btn("solid", t.joinH, mailUrl(t.joinSubject), "mail", true)); fc.appendChild(jl); }
    $("copyText").textContent = t.copy; $("toTop").textContent = t.top;

    var lb = $("langBtn"); lb.textContent = t.langBtn; lb.setAttribute("aria-label", t.langAria);
    lb.lang = lang === "ar" ? "en" : "ar";
    syncTheme();
  }

  function syncTheme() {
    var th = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
    $("themeBtn").setAttribute("aria-label", UI[lang].themeAria[th]);
    setMeta('meta[name="theme-color"]', "content", th === "dark" ? "#191511" : "#f4ecdc");
  }

  $("langBtn").addEventListener("click", function () {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("qirtas-lang", lang); } catch (e) {}
    render();
  });
  $("themeBtn").addEventListener("click", function () {
    var th = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", th);
    try { localStorage.setItem("qirtas-theme", th); } catch (e) {}
    syncTheme();
  });
  render();
})();
</script>
</body>
</html>
