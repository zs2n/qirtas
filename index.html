<style>
:root{
  --ground:#f4ecdc; --raised:#fbf6ec; --rule:#d9c9ac; --ink:#1f1a14; --muted:#6b5d4a;
  --accent:#a3341f; --accent-soft:#f5ddd2; --on-accent:#fff8ee; --gilt:#b8862b;
  --f-display:"Reem Kufi","Noto Kufi Arabic",system-ui,sans-serif;
  --f-ui:"Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-text:"Noto Naskh Arabic","Traditional Arabic",serif;
}
:root[data-theme="dark"]{
  --ground:#191511; --raised:#231e18; --rule:#3d342a; --ink:#f1e8d8; --muted:#b3a48d;
  --accent:#e8775c; --accent-soft:#3d1d14; --on-accent:#191511; --gilt:#d6a64a;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --ground:#191511; --raised:#231e18; --rule:#3d342a; --ink:#f1e8d8; --muted:#b3a48d;
    --accent:#e8775c; --accent-soft:#3d1d14; --on-accent:#191511; --gilt:#d6a64a; color-scheme:dark;
  }
}
:root[lang="en"]{
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-text:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.8 var(--f-ui);overflow-wrap:anywhere}
img,svg{display:block;max-width:100%}
a{color:var(--accent);text-underline-offset:.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:12px;top:-100px;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:3px;z-index:10;text-decoration:none}
.skip:focus{top:12px}
.wrap{width:100%;max-width:960px;margin-inline:auto;padding-inline:24px}

/* header */
header.top{border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:inline-flex;align-items:center;min-height:44px}
.brand img{height:30px;width:auto}
.logo-dark{display:none}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]) .logo-light{display:none}
  :root:not([data-theme]) .logo-dark{display:block}
}
.tools{display:flex;gap:8px}
.btn-icon{min-width:44px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:3px;font:600 14px/1 var(--f-ui);cursor:pointer}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.ico-sun{display:none}
:root[data-theme="dark"] .ico-sun{display:block}
:root[data-theme="dark"] .ico-moon{display:none}
nav.main{display:flex;flex-wrap:wrap;gap:4px 20px;padding-bottom:8px}
nav.main a{min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;border-block-end:2px solid transparent}
nav.main a:hover{color:var(--accent);border-color:var(--accent)}

/* hero */
.hero{padding-block:56px 16px}
.hero-logo{margin:0}
.hero-logo img{width:min(310px,80%);height:auto}
.hero .rule{width:72px;height:3px;background:var(--gilt);margin-block:24px}
.hero p{margin:0;max-width:34em;font:400 19px/2 var(--f-text);color:var(--ink)}
:root[lang="en"] .hero p{font-size:18px;line-height:1.7}

section{padding-block:40px;border-top:1px solid var(--rule)}
section h2{margin:0 0 24px;font:600 clamp(24px,5vw,32px)/1.4 var(--f-display)}
.sec-about p{margin:0;max-width:36em;font:400 19px/2 var(--f-text)}
:root[lang="en"] .sec-about p{font-size:18px;line-height:1.7}

/* games */
.games{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.games{grid-template-columns:repeat(2,1fr)}}
.game{background:var(--raised);border:1px solid var(--rule);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px}
.game.soon{background:transparent;border-style:dashed}
.game h3{margin:0;font:600 22px/1.4 var(--f-display);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.badge{font:600 13px/1 var(--f-ui);padding:6px 10px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.game.soon .badge{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.game p{margin:0;color:var(--ink);font:400 16px/1.9 var(--f-text)}
:root[lang="en"] .game p{font-size:16px;line-height:1.6}
.game.soon h3{color:var(--muted)}
.credit{font-size:14px;color:var(--muted)}
.credit a{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.play{margin-top:auto;align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 20px;background:var(--accent);color:var(--on-accent);border-radius:3px;text-decoration:none;font-weight:600}
.play:hover{filter:brightness(1.1)}
.play svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
[dir="rtl"] .arrow{transform:scaleX(-1)}

/* contact / news */
.ig{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1px solid var(--accent);border-radius:3px;font-weight:600;text-decoration:none;direction:ltr}
.ig:hover{background:var(--accent);color:var(--on-accent)}
.soonline,.empty{margin:0;color:var(--muted);font-size:16px}
.posts{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.post{background:var(--raised);border:1px solid var(--rule);border-radius:6px;padding:20px}
.post h3{margin:0 0 4px;font:600 20px/1.5 var(--f-display)}
.post time{display:block;color:var(--muted);font-size:14px;margin-bottom:8px}
.post p{margin:0;font:400 16px/1.9 var(--f-text)}

footer{border-top:1px solid var(--rule);padding-block:28px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
footer a{min-height:44px;display:inline-flex;align-items:center}
</style>
</head>

<a class="skip" href="#main" id="skip"></a>

<header class="top">
  <div class="wrap">

      <a class="brand" href="#top" id="brand">
        <img class="logo-light" src="assets/qirtas-wordmark.svg" width="82" height="30" alt="قرطاس">

          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

</main>

<script>
/* ============================================================
   كل محتوى الموقع هنا. لا تلمس التصميم.

   • إضافة لعبة: أضف سطرًا جديدًا في مصفوفة games:
       { id:"x", status:"live", name:{ar:"..",en:".."}, line:{ar:"..",en:".."}, url:"https://..." }
     الحالة "live" لعبة متاحة (تحتاج url)، و"soon" قريبًا (بلا رابط).
     credit اختياري: { ar:"نص قبل", en:"text before", name:{ar:"..",en:".."}, url:"https://.." }
   • إضافة خبر: أضف سطرًا في مصفوفة posts:
       { date:"2026-11-23", title:{ar:"..",en:".."}, text:{ar:"..",en:".."} }
   • حساب إنستقرام: ضع المعرّف في instagram (مثل "qirtas.studio") فيظهر الزر. اتركه null ليظهر «قريبًا».
   ============================================================ */
const SITE = {
  studioUrl: "https://zs2n.github.io/qirtas/",
  instagram: null,
  about: {
    ar: "قرطاس استوديو عربي يصنع ألعابًا تُلعب من المتصفح مباشرةً وعلى الجوال. لا تحميل: افتح الرابط والعب.",
    en: "Qirtas is an Arabic game studio. We make games you play right in the browser, on your phone too. No download: open the link and play."
  },
  games: [
    { id: "alkhatm", status: "live", name: { ar: "الختم", en: "Al-Khatm" },
      line: { ar: "لعبة فحص مستندات بالبكسل آرت بمناسبة اليوم العالمي لمكافحة الفساد، تُلعب من الجوال.",
              en: "A pixel-art document-inspection game for International Anti-Corruption Day, made for phones." },
      url: "https://zs2n.github.io/alkhatm/",
      credit: { ar: "بالتعاون مع", en: "In collaboration with",
                name: { ar: "نادي نزاهة", en: "Nazaha Club" }, url: "https://www.instagram.com/nazaha_iau/" } },
    { id: "akhwiya", status: "soon", name: { ar: "تقاضي الأخوياء", en: "Taqadi Al-Akhwiya" },
      line: { ar: "لعبة جماعية يحكم فيها قاضٍ بالذكاء الاصطناعي.", en: "A group game judged by an AI judge." }, url: null },
    { id: "arwand", status: "soon", name: { ar: "عرش أرْوَند", en: "Throne of Arwand" },
      line: { ar: "لعبة إدارة مملكة.", en: "A kingdom-management game." }, url: null },
    { id: "port1960", status: "soon", name: { ar: "ميناء 1960", en: "Port 1960" },
      line: { ar: "لعبة بيكسل آرت بقصة.", en: "A pixel-art game with a story." }, url: null },
    { id: "sevenfloors", status: "soon", name: { ar: "Seven Floors", en: "Seven Floors" },
      line: { ar: "لعبة رعب.", en: "A horror game." }, url: null }
  ],
  posts: []
};

const UI = {
  ar: {
    title: "قرطاس — استوديو ألعاب عربي",
    desc: SITE.about.ar,
    skip: "تخطّي إلى المحتوى", home: "قرطاس",
    nav: { about: "من نحن", games: "الألعاب", contact: "تواصل", news: "الأخبار" },
    h: { about: "من نحن", games: "معرض الألعاب", contact: "تواصل وحسابات", news: "المدوّنة والأخبار" },
    live: "متاحة", soon: "قريبًا", play: "العب الآن", playAria: "العب ",
    ig: "إنستقرام", igSoon: "حساباتنا قريبًا.", noNews: "لا أخبار بعد.",
    foot: "قرطاس — استوديو ألعاب عربي", top: "إلى الأعلى",
    langBtn: "EN", langAria: "Switch to English", themeAria: { dark: "التبديل إلى النمط الفاتح", light: "التبديل إلى النمط الداكن" }
  },
  en: {
    title: "Qirtas — Arabic game studio",
    desc: SITE.about.en,
    skip: "Skip to content", home: "Qirtas",
    nav: { about: "About", games: "Games", contact: "Contact", news: "News" },
    h: { about: "About", games: "Games", contact: "Contact & accounts", news: "Blog & news" },
    live: "Available", soon: "Coming soon", play: "Play now", playAria: "Play ",
    ig: "Instagram", igSoon: "Our accounts are coming soon.", noNews: "No news yet.",
    foot: "Qirtas — Arabic game studio", top: "Back to top",
    langBtn: "ع", langAria: "التبديل إلى العربية", themeAria: { dark: "Switch to light mode", light: "Switch to dark mode" }
  }
};

(function () {
  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var lang = root.lang === "en" ? "en" : "ar";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  /* اسم بالإنجليزية داخل نص عربي: bdi يحميه من كسر الجملة */
  function nameNode(n) {
    var b = document.createElement("bdi");
    b.textContent = n[lang];
    return b;
  }
  function ext(a, href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }
  function arrow() {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "arrow"); s.setAttribute("aria-hidden", "true");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M5 12h14M13 6l6 6-6 6"); s.appendChild(p); return s;
  }
  function setMeta(sel, attr, val) { var m = document.querySelector(sel); if (m) m.setAttribute(attr, val); }

  function render() {
    var t = UI[lang];
    root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t.title;
    setMeta('meta[name="description"]', "content", t.desc);
    setMeta('meta[property="og:title"]', "content", t.title);
    setMeta('meta[property="og:description"]', "content", t.desc);
    setMeta('meta[property="og:locale"]', "content", lang === "ar" ? "ar_AR" : "en_US");
    setMeta('meta[property="og:locale:alternate"]', "content", lang === "ar" ? "en_US" : "ar_AR");
    setMeta('meta[property="og:image:alt"]', "content", t.home);
    setMeta('meta[property="og:url"]', "content", SITE.studioUrl);

    $("skip").textContent = t.skip;
    Array.prototype.forEach.call(document.querySelectorAll(".brand img, .hero-logo img"), function (i) { i.alt = t.home; });
    var nav = $("nav"); nav.textContent = "";
    nav.setAttribute("aria-label", lang === "ar" ? "التنقل الرئيسي" : "Main navigation");
    ["about", "games", "contact", "news"].forEach(function (k) {
      var a = el("a", null, t.nav[k]); a.href = "#" + k; nav.appendChild(a);
    });
    $("h-about").textContent = t.h.about; $("aboutText").textContent = SITE.about[lang];
    $("h-games").textContent = t.h.games; $("h-contact").textContent = t.h.contact; $("h-news").textContent = t.h.news;

    /* الألعاب */
    var ul = $("gamesList"); ul.textContent = "";
    SITE.games.forEach(function (g) {
      var live = g.status === "live" && g.url;
      var li = el("li", "game" + (live ? "" : " soon"));
      var h = el("h3"); var nm = el("span"); nm.appendChild(nameNode(g.name)); h.appendChild(nm);
      h.appendChild(el("span", "badge", live ? t.live : t.soon)); li.appendChild(h);
      if (g.line) li.appendChild(el("p", null, g.line[lang]));
      if (live && g.credit) {
        var c = el("p", "credit"); c.appendChild(document.createTextNode(g.credit[lang] + " "));
        c.appendChild(ext(el("a", null, g.credit.name[lang]), g.credit.url)); li.appendChild(c);
      }
      if (live) {
        var a = ext(el("a", "play"), g.url);
        a.appendChild(el("span", null, t.play)); a.appendChild(arrow());
        a.setAttribute("aria-label", t.playAria + g.name[lang]);
        li.appendChild(a);
      }
      ul.appendChild(li);
    });

    /* التواصل */
    var cb = $("contactBody"); cb.textContent = "";
    if (SITE.instagram) {
      var id = String(SITE.instagram).replace(/^@/, "");
      var ig = ext(el("a", "ig", "Instagram · @" + id), "https://www.instagram.com/" + encodeURIComponent(id) + "/");
      cb.appendChild(ig);
    } else cb.appendChild(el("p", "soonline", t.igSoon));

    /* الأخبار */
    var nb = $("newsBody"); nb.textContent = "";
    if (!SITE.posts.length) nb.appendChild(el("p", "empty", t.noNews));
    else {
      var pl = el("ul", "posts");
      SITE.posts.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (p) {
        var li = el("li", "post"); li.appendChild(el("h3", null, p.title[lang]));
        var tm = el("time", null, fmtDate(p.date)); tm.dateTime = p.date; li.appendChild(tm);
        li.appendChild(el("p", null, p.text[lang])); pl.appendChild(li);
      });
      nb.appendChild(pl);
    }

    $("footText").textContent = t.foot; $("toTop").textContent = t.top;
    var lb = $("langBtn"); lb.textContent = t.langBtn; lb.setAttribute("aria-label", t.langAria);
    lb.lang = lang === "ar" ? "en" : "ar";
    syncTheme();
  }

  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (!m) return s;
    try {
      return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString(lang === "ar" ? "ar-u-nu-latn" : "en", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
    } catch (e) { return s; }
  }

  function syncTheme() {
    var th = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
    $("themeBtn").setAttribute("aria-label", UI[lang].themeAria[th]);
    setMeta('meta[name="theme-color"]', "content", th === "dark" ? "#191511" : "#f4ecdc");
  }

  $("langBtn").addEventListener("click", function () {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem("qirtas-lang", lang); } catch (e) {}
    render();
  });
  $("themeBtn").addEventListener("click", function () {
    var th = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", th);
    try { localStorage.setItem("qirtas-theme", th); } catch (e) {}
    syncTheme();
  });
  render();
})();
</script>
</body>
</html>
